name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or 1.0.0-beta.1). Leave blank for a CI build.'
        required: false
        type: string
      create_release:
        description: 'Create and publish a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows Release (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v')
            $shouldRelease = "true"
          } else {
            $inputVersion = "${{ inputs.version }}".Trim().TrimStart('v')
            if ([string]::IsNullOrWhiteSpace($inputVersion)) {
              $version = "1.0.0-ci.${{ github.run_number }}"
            } else {
              $version = $inputVersion
            }
            $tag = "v$version"
            $shouldRelease = if ("${{ inputs.create_release }}" -eq "true") { "true" } else { "false" }
          }

          if ($version -match '^(\d+)\.(\d+)\.(\d+)') {
            $numericVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } else {
            $numericVersion = "1.0.0.0"
          }

          $isPrerelease = if ($version -match '-') { "true" } else { "false" }

          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "numeric_version=$numericVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "should_release=$shouldRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Version:         $version"
          Write-Host "Tag:             $tag"
          Write-Host "Numeric Version: $numericVersion"
          Write-Host "Prerelease:      $isPrerelease"
          Write-Host "Create Release:  $shouldRelease"

      - name: Restore dependencies
        run: dotnet restore FerdiumPlus.sln

      - name: Run unit tests
        run: dotnet test FerdiumPlus.sln -c Release --no-restore --verbosity normal

      - name: Build production portable executable (win-x64)
        shell: pwsh
        run: |
          dotnet publish FerdiumPlus/FerdiumPlus.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.numeric_version }} `
            -p:FileVersion=${{ steps.version.outputs.numeric_version }} `
            -o publish/portable

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "publish/portable/FerdiumPlus.exe" "release-assets/FerdiumPlus-${{ steps.version.outputs.version }}-win-x64-portable.exe"

      - name: Build production app files for installer (win-x64)
        shell: pwsh
        run: |
          dotnet publish FerdiumPlus/FerdiumPlus.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.numeric_version }} `
            -p:FileVersion=${{ steps.version.outputs.numeric_version }} `
            -o publish/app

      - name: Build Windows Setup installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found at default path; installing via Chocolatey..."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source } else { throw "ISCC.exe not found after installation." }
          }

          $sourceDir = (Resolve-Path "publish/app").Path
          $outputDir = (Resolve-Path "release-assets").Path
          $setupName = "FerdiumPlus-Setup-${{ steps.version.outputs.version }}-win-x64"

          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMyAppNumericVersion=${{ steps.version.outputs.numeric_version }}" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            "/DOutputBaseFilename=$setupName" `
            "installer/FerdiumPlus.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Push-Location release-assets
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path "SHA256SUMS.txt" -Encoding utf8NoBOM
          Get-Content "SHA256SUMS.txt"
          Pop-Location

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FerdiumPlus-${{ steps.version.outputs.version }}-win-x64
          path: release-assets/*
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ferdium Plus ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/FerdiumPlus-Setup-${{ steps.version.outputs.version }}-win-x64.exe
            release-assets/FerdiumPlus-${{ steps.version.outputs.version }}-win-x64-portable.exe
            release-assets/SHA256SUMS.txt
